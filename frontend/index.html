<body>
<div class="bg-glow"></div>
<div class="bg-grid"></div>
<div id="root" class="relative z-10"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback, Fragment } = React;

// ============ ICONS (Lucide) ============
const Ic = ({name, className="icon-md", strokeWidth=2}) => {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    ref.current.innerHTML = '';
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.style.width = '100%';
    svg.style.height = '100%';
    ref.current.appendChild(svg);
    try {
      const icons = window.lucide?.icons || {};
      const pascal = String(name || '')
        .split(/[-_\s]+/)
        .map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : '')
        .join('');
      const iconData = icons[name] || icons[pascal] || icons[String(name).toLowerCase()];
      if (Array.isArray(iconData)) {
        // Supports both Lucide v0.3x+ ([ [tag, attrs], ... ]) and legacy ([tag, attrs, children])
        const paths = Array.isArray(iconData[0]) ? iconData : (Array.isArray(iconData[2]) ? iconData[2] : []);
        paths.forEach(p => {
          if (!Array.isArray(p)) return;
          const [tag, attrs] = p;
          const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
          if (attrs && typeof attrs === 'object') {
            Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
          }
          el.setAttribute('stroke-width', strokeWidth);
          svg.appendChild(el);
        });
      }
    } catch(e){}
  }, [name, strokeWidth]);
  return <i ref={ref} style={{display:'inline-flex',alignItems:'center',justifyContent:'center'}} className={className}></i>;
};

// ============ STORAGE KEYS & UTILITIES ============
const LS_KEY = 'quantlog.v1';
const LS_FALLBACKS = ['quantlog.v1','quantlog.v4','quantlog.v3','quantlog.v2','quantlog.v1'];
const LS_API_KEY = 'quantlog.api.v1'; // Kept v1 key for 100% compatibility with user's existing API config
const LS_PREFS_KEY = 'quantlog.v1.prefs'; // Stores v1 account risk modes locally in case backend v1 strips them

const getLocalPrefs = () => {
  try { return JSON.parse(localStorage.getItem(LS_PREFS_KEY) || '{}'); }
  catch(e) { return {}; }
};
const saveLocalPrefs = (accounts, activeAccountId) => {
  try {
    const cur = getLocalPrefs();
    const riskModes = { ...(cur.riskModes || {}) };
    if (Array.isArray(accounts)) {
      accounts.forEach(a => {
        if (a && a.id && a.riskBaseMode) riskModes[a.id] = a.riskBaseMode;
      });
    }
    localStorage.setItem(LS_PREFS_KEY, JSON.stringify({
      riskModes,
      activeAccountId: activeAccountId || cur.activeAccountId || ''
    }));
  } catch(e) {}
};

const uid = () => 'id-' + Math.random().toString(36).slice(2,11) + Date.now().toString(36);
const dayKey = (d) => {
  if (!d) return '';
  if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0,10);
  const date = typeof d === 'string' ? new Date(d) : d;
  if (isNaN(date)) return '';
  const yr = date.getFullYear();
  const mo = String(date.getMonth() + 1).padStart(2, '0');
  const da = String(date.getDate()).padStart(2, '0');
  return `${yr}-${mo}-${da}`;
};
const weekKey = (d) => {
  const date = new Date(d);
  if (isNaN(date)) return '';
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(date.setDate(diff));
  return dayKey(monday);
};
const fmtMoney = (v) => {
  if (v == null || isNaN(v)) return '$0.00';
  const sign = v < 0 ? '-' : '';
  return sign + '$' + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
};
const fmtNum = (v, d=2) => {
  if (v == null || isNaN(v)) return '—';
  return Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
};
const fmtPct = (v, d=1) => {
  if (v == null || isNaN(v)) return '—';
  return (Number(v)).toFixed(d) + '%';
};
const safeNum = (v, d=0) => {
  const n = parseFloat(v);
  return isNaN(n) ? d : n;
};

// ============ INDEXEDDB FOR SCREENSHOTS ============
const DB_NAME = 'quantlog-files';
const DB_STORE = 'files';
let dbPromise = null;

const openDB = () => {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB not supported')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORE)) {
        db.createObjectStore(DB_STORE);
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return dbPromise;
};

const saveFile = async (id, blob) => {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(blob, id);
      tx.oncomplete = () => resolve(true);
      tx.onerror = (e) => reject(e);
    });
  } catch(e) { console.error('saveFile', e); return false; }
};

const getFile = async (id) => {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = (e) => reject(e);
    });
  } catch(e) { return null; }
};

const deleteFile = async (id) => {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(id);
      tx.oncomplete = () => resolve(true);
    });
  } catch(e) { return false; }
};

// ============ INSTRUMENT MULTIPLIER & FINANCIAL MATH (UPGRADED v1) ============
const getMultiplier = (asset, instruments) => {
  if (!asset || !instruments) return 1;
  const key = String(asset).toUpperCase();
  const inst = instruments.find(i => i.symbol && i.symbol.toUpperCase() === key);
  if (!inst) return 1;
  const m = parseFloat(inst.multiplier);
  return (isNaN(m) || m <= 0) ? 1 : m;
};

const calcTrade = (t, instruments) => {
  const dir = t.direction === 'SHORT' ? -1 : 1;
  const mult = getMultiplier(t.asset, instruments);
  const size = safeNum(t.size, 0);
  const entry = safeNum(t.entry, 0);
  const exit = safeNum(t.exit, 0);
  const sl = safeNum(t.stopLoss, 0);
  const tp = safeNum(t.takeProfit, 0);
  const commission = safeNum(t.commission, 0);

  const gross = (t.status === 'closed' && entry > 0 && exit > 0)
    ? (exit - entry) * dir * size * mult
    : null;
  const net = gross != null ? gross - commission : null;

  const riskDist = (entry > 0 && sl > 0) ? Math.abs(entry - sl) : 0;
  const risk$ = riskDist * size * mult;

  // Planned R:R based on Entry, SL, and TP
  let plannedRR = null;
  if (entry > 0 && sl > 0 && tp > 0 && riskDist > 0) {
    const rewardDist = dir === 1 ? (tp - entry) : (entry - tp);
    if (rewardDist > 0) plannedRR = rewardDist / riskDist;
  }

  // Gross R (pure price movement vs initial stop distance)
  const grossR = (t.status === 'closed' && riskDist > 0 && entry > 0 && exit > 0)
    ? ((exit - entry) * dir) / riskDist
    : null;

  // Net R (true institutional R accounting for commissions when risk$ > 0)
  const R = (t.status === 'closed' && riskDist > 0 && entry > 0 && exit > 0)
    ? (risk$ > 0 && net != null ? (net / risk$) : grossR)
    : null;

  // MAE / MFE in R units
  let maeR = null, mfeR = null, capture = null, pain = null;
  if (t.status === 'closed' && riskDist > 0 && entry > 0) {
    const mae = safeNum(t.maePrice);
    const mfe = safeNum(t.mfePrice);
    if (mae > 0) {
      const maeDist = t.direction === 'LONG'
        ? Math.max(0, entry - mae)
        : Math.max(0, mae - entry);
      maeR = maeDist / riskDist;
    }
    if (mfe > 0) {
      const mfeDist = t.direction === 'LONG'
        ? Math.max(0, mfe - entry)
        : Math.max(0, entry - mfe);
      mfeR = mfeDist / riskDist;
    }
    if (grossR != null && mfeR > 0) capture = grossR / mfeR;
    if (maeR != null && grossR != null) pain = maeR / Math.max(Math.abs(grossR), 1e-9);
  }

  return { dir, mult, gross, net, risk$, riskDist, grossR, R, plannedRR, maeR, mfeR, capture, pain, commission };
};

// Capa CQRS: usa métricas calculadas por la API (pnlNet, pnlGross, riskUsd) y cae a calcTrade
// para trades locales sin sincronizar. R = R neto (pnlNet / riskUsd), igual que calcTrade.
// Campos secundarios (MAE/MFE, plannedRR...) se calculan de forma perezosa solo si se leen.
const getMetrics = (t, instruments) => {
  if (t.pnlNet == null) return calcTrade(t, instruments);
  const net = t.pnlNet, gross = t.pnlGross ?? null, risk$ = t.riskUsd ?? 0;
  const R = risk$ > 0 ? net / risk$ : null;
  let full;
  const lazy = () => (full ??= calcTrade(t, instruments));
  const m = { gross, net, risk$, R };
  for (const k of ['dir','mult','riskDist','grossR','plannedRR','maeR','mfeR','capture','pain','commission'])
    Object.defineProperty(m, k, { get: () => lazy()[k], enumerable: true });
  return m;
};

};

// ============ QLAPI (100% Compatible with quantlog-api/main.py) ============
// Base vacía = rutas relativas (mismo origen). Sobrescribible con window.QL_API_BASE.
const QL_DEFAULT_BASE = window.QL_API_BASE || '';
const QLAPI = {
  settings() {
    try {
      const raw = localStorage.getItem(LS_API_KEY);
      if (!raw) return { baseUrl:QL_DEFAULT_BASE, apiKey:'' };
      const parsed = JSON.parse(raw);
      return {
        baseUrl: parsed.baseUrl ?? QL_DEFAULT_BASE,
        apiKey: parsed.apiKey || ''
      };
    } catch(e) { return { baseUrl:QL_DEFAULT_BASE, apiKey:'' }; }
  },
  save(settings) {
    localStorage.setItem(LS_API_KEY, JSON.stringify(settings || {baseUrl:QL_DEFAULT_BASE, apiKey:''}));
  },
  buildPayload(state) {
    // Sends version: 5 as required by main.py line: `if body.get('version') != 5: raise HTTPException(400)`
    // Also includes riskBaseMode on each account (in case user added column to MariaDB) AND inside settings.riskModes
    const riskModes = {};
    if (Array.isArray(state.accounts)) {
      state.accounts.forEach(a => {
        if (a && a.id) riskModes[a.id] = a.riskBaseMode || 'current';
      });
    }
    saveLocalPrefs(state.accounts, state.settings?.activeAccountId);
    return {
      version: 5,
      trades: Array.isArray(state.trades) ? state.trades : [],
      accounts: Array.isArray(state.accounts) ? state.accounts.map(a => ({
        ...a,
        riskBaseMode: a.riskBaseMode || 'current'
      })) : [],
      settings: {
        activeAccountId: state.settings?.activeAccountId || 'acc-default',
        riskModes
      },
      instruments: Array.isArray(state.instruments) ? state.instruments : [],
      reviews: state.reviews || {}
    };
  },
  async request(path, options = {}) {
    const cfg = this.settings();
    const url = (cfg.baseUrl || '').replace(/\/$/, '') + path;
    const headers = { 'Content-Type':'application/json', ...(options.headers||{}) };
    if (cfg.apiKey) headers['Authorization'] = 'Bearer ' + cfg.apiKey;
    const res = await fetch(url, { ...options, headers });
    if (!res.ok) {
      const txt = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${txt.slice(0,200)}`);
    }
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) return await res.json();
    return await res.text();
  },
  async health() { return this.request('/api/v1/health'); },
  async pull() {
    const data = await this.request('/api/v1/state');
    return normalizeImport(data);
  },
  async push(state) {
    const payload = this.buildPayload(state);
    return this.request('/api/v1/state', {
      method: 'PUT',
      body: JSON.stringify(payload)
    });
  }
};

// ============ CSV HELPERS ============
const detectDelimiter = (text) => {
  const firstLine = text.split(/\r?\n/)[0] || '';
  const counts = {',':0, ';':0, '\t':0};
  let inQuotes = false;
  for (const c of firstLine) {
    if (c === '"') inQuotes = !inQuotes;
    else if (!inQuotes && counts[c] !== undefined) counts[c]++;
  }
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
};

const parseCSV = (text) => {
  const delim = detectDelimiter(text);
  const rows = [];
  let cur = '', row = [], inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      if (inQuotes && text[i+1] === '"') { cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (c === delim && !inQuotes) {
      row.push(cur); cur = '';
    } else if ((c === '\n' || c === '\r') && !inQuotes) {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur);
      rows.push(row);
      row = []; cur = '';
    } else cur += c;
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.length && r.some(c => c.trim() !== ''));
};

const autoMapCSV = (rows) => {
  if (rows.length < 2) return [];
  const header = rows[0].map(h => String(h).trim().toLowerCase().replace(/[^a-z0-9]/g,''));
  const map = {};
  Object.entries(FIELD_MAP).forEach(([field, aliases]) => {
    for (const a of aliases) {
      const idx = header.findIndex(h => h === a);
      if (idx >= 0) { map[field] = idx; break; }
    }
  });
  return rows.slice(1).map(r => {
    const obj = {};
    Object.entries(map).forEach(([f, idx]) => { obj[f] = (r[idx]||'').trim(); });
    return obj;
  }).filter(o => o.datetime && o.asset);
};

const csvEscape = (v) => {
  const s = v == null ? '' : String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
};

// ============ ANIMATED NUMBER ============
const AnimNum = ({value, formatter=fmtNum, duration=550}) => {
  const [display, setDisplay] = useState(value);
  const ref = useRef(value);
  useEffect(() => {
    const start = ref.current;
    const end = value;
    if (start === end || isNaN(end) || !isFinite(end)) {
      setDisplay(end);
      ref.current = end;
      return;
    }
    const t0 = performance.now();
    let raf;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1-k, 3);
      setDisplay(start + (end - start) * eased);
      if (k < 1) raf = requestAnimationFrame(step);
      else ref.current = end;
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value, duration]);
  return <>{formatter(display)}</>;
};

    .slice(0, 12);
  if (!closed.length) {
    return (

        <span className="text-xs text-slate-500">Sin operaciones cerradas en el periodo seleccionado</span>
      </div>
    );
  }
  const items = [...closed, ...closed];
  return (
    <div className="ticker">
      <div className="ticker-track">
        {items.map((t, i) => {
          const c = getMetrics(t, instruments);
          const win = c.net > 0;
          return (
            <div key={i} onClick={() => onSelectTrade && onSelectTrade(t)}
              className="flex items-center gap-2.5 flex-shrink-0 cursor-pointer hover:opacity-80 transition-opacity">

              <span className="font-mono text-xs text-gold">

              </span>
              <span className="text-slate-600">│</span>
            </div>
          );
        })}
      </div>
    </div>
  );

  const apiConfigured = !!(apiCfg.baseUrl);
  const { syncState, syncLastPush } = useAutoSync(state, autoSyncEnabled, apiConfigured);

  const toggleAutoSync = () => {
    const next = !autoSyncEnabled;
    setAutoSyncEnabled(next);
    try { localStorage.setItem('quantlog.autosync', next ? 'true' : 'false'); } catch(e){}
  };

  const accounts = state.accounts.length > 0
    ? state.accounts

    !activeAccountId || t.accountId === activeAccountId || t.accountId === 'acc-default' || accounts.length === 1
  ), [state.trades, activeAccountId, accounts.length]);

  // Calculate true dynamic current equity across all closed trades for active account
  const totalRealizedPnL = useMemo(() => {
    return trades
      .filter(t => t.status === 'closed')
      .reduce((sum, t) => sum + (getMetrics(t, state.instruments).net || 0), 0);
  }, [trades, state.instruments]);

  const currentEquity = (activeAccount?.initialBalance || 0) + totalRealizedPnL;

  const update = (fn) => setState(s => {

    return { ...next };
  });

  const saveTrade = async (t, screenshotBlob) => {

      ...t,

      const exists = s.trades.some(x => x.id === id);
      const nextTrades = exists
        ? s.trades.map(x => x.id === id ? newTrade : x)
        : [...s.trades, newTrade];
      return { ...s, trades: nextTrades };
    });
    toast(t.id ? 'Operación actualizada ✓' : 'Operación registrada ✓', 'ok');
    setEditingTrade(null);

// ============ DASHBOARD ============
const Dashboard = ({trades, accounts, instruments, activeAccount, currentEquity, onChangeRiskMode, onInspectTrade, setTab}) => {
  const [period, setPeriod] = useState('total');

  // All closed trades sorted chronologically
  const allClosedSorted = useMemo(() => {
    return trades
      .filter(t => t.status === 'closed')
      .slice()
      .sort((a,b) => new Date(a.datetime) - new Date(b.datetime));
  }, [trades]);

  const { filtered, periodStartEquity } = useMemo(() => {
    const initialBal = activeAccount?.initialBalance || 10000;
    if (period === 'total') {
      return { filtered: allClosedSorted, periodStartEquity: initialBal };
    }
    const now = new Date();
    const cutoff = new Date();
    if (period === 'hoy') cutoff.setHours(0,0,0,0);
    else if (period === '7d') cutoff.setDate(now.getDate() - 7);
    else if (period === '30d') cutoff.setDate(now.getDate() - 30);

    let priorPnL = 0;
    const within = [];
    allClosedSorted.forEach(t => {
      if (new Date(t.datetime) < cutoff) {
        priorPnL += getMetrics(t, instruments).net || 0;
      } else {
        within.push(t);
      }
    });
    return { filtered: within, periodStartEquity: initialBal + priorPnL };
  }, [allClosedSorted, period, activeAccount, instruments]);

  const stats = useMemo(() => {
    // Already sorted chronologically
    const computed = filtered.map(t => ({ t, c: getMetrics(t, instruments) }));
    const wins = computed.filter(x => x.c.net > 0);
    const losses = computed.filter(x => x.c.net < 0);
    const totalPnL = computed.reduce((s, x) => s + (x.c.net || 0), 0);
    const totalCommissions = computed.reduce((s, x) => s + (x.c.commission || 0), 0);
    const winRate = computed.length ? (wins.length / computed.length) * 100 : 0;
    const grossWin = wins.reduce((s,x) => s + x.c.net, 0);
    const grossLoss = Math.abs(losses.reduce((s,x) => s + x.c.net, 0));
    const pf = grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0);
    const avgWin = wins.length ? grossWin / wins.length : 0;
    const avgLoss = losses.length ? grossLoss / losses.length : 0;
    const payoffRatio = avgLoss > 0 ? avgWin / avgLoss : 0;
    const expectation = (winRate/100 * avgWin) - ((1 - winRate/100) * avgLoss);

    const validRs = computed.map(x => x.c.R).filter(r => r != null && !isNaN(r));
    const avgR = validRs.length ? validRs.reduce((s,r) => s + r, 0) / validRs.length : 0;

    // Standard deviation of R & Van Tharp SQN
    let stdR = 0, sqn = 0, sharpe = 0, sortino = 0;
    if (validRs.length > 1) {
      const variance = validRs.reduce((s, r) => s + Math.pow(r - avgR, 2), 0) / (validRs.length - 1);
      stdR = Math.sqrt(variance);
      if (stdR > 0) {
        sqn = Math.sqrt(validRs.length) * (avgR / stdR);
        sharpe = avgR / stdR;
      }
      const downsideVariance = validRs.reduce((s, r) => s + (r < 0 ? Math.pow(r, 2) : 0), 0) / validRs.length;
      const downsideDev = Math.sqrt(downsideVariance);
      if (downsideDev > 0) sortino = avgR / downsideDev;
    }

    // Kelly Criterion %
    const wProb = winRate / 100;
    const kellyPct = payoffRatio > 0
      ? Math.max(0, (wProb - (1 - wProb) / payoffRatio) * 100)
      : 0;

    // Chronological Equity Curve & Drawdown + Ulcer Index
    let eq = periodStartEquity;
    let peak = eq;
    let maxDD = 0, maxDDPct = 0;
    let sumSqDD = 0;
    const equityCurve = [{t:0, eq, R:0, date: 'Inicio'}];
    let rAccum = 0;

    computed.forEach((x, i) => {
      eq += x.c.net || 0;
      rAccum += x.c.R || 0;
      if (eq > peak) peak = eq;
      const dd = peak - eq;
      const ddPct = peak > 0 ? (dd / peak) * 100 : 0;
      if (dd > maxDD) maxDD = dd;
      if (ddPct > maxDDPct) maxDDPct = ddPct;
      sumSqDD += ddPct * ddPct;
      equityCurve.push({
        t: i + 1,
        eq,
        R: rAccum,
        asset: x.t.asset,
        net: x.c.net,
        date: new Date(x.t.datetime).toLocaleDateString('es-ES')
      });
    });

    const ulcerIndex = computed.length > 0 ? Math.sqrt(sumSqDD / computed.length) : 0;
    const recoveryFactor = maxDD > 0 ? totalPnL / maxDD : (totalPnL > 0 ? Infinity : 0);

    // True Chronological Streaks
    let best=0, worst=0, curBest=0, curWorst=0, currentStreak=0;
    computed.forEach(x => {
      if (x.c.net > 0) {
        curBest++; curWorst = 0;
        best = Math.max(best, curBest);
        currentStreak = curBest;
      } else if (x.c.net < 0) {
        curWorst++; curBest = 0;
        worst = Math.max(worst, curWorst);
        currentStreak = -curWorst;
      } else {
        curBest = 0; curWorst = 0; currentStreak = 0;
      }
    });

    return {
      totalPnL, totalCommissions, winRate, pf, payoffRatio, expectation,
      avgR, stdR, sqn, sharpe, sortino, kellyPct, ulcerIndex, recoveryFactor,
      maxDD, maxDDPct, best, worst, currentStreak, equityCurve,
      wins: wins.length, losses: losses.length, total: computed.length
    };
  }, [filtered, periodStartEquity, instruments]);

  // Risk Management Engine (Compounding Current Equity vs Static Initial Balance)
  const riskBaseMode = activeAccount?.riskBaseMode || 'current';
  const baseCapital = riskBaseMode === 'current' ? Math.max(0, currentEquity) : (activeAccount?.initialBalance || 10000);

  const today = dayKey(new Date());
  const currentWeek = weekKey(new Date());
  const todayTrades = trades.filter(t => dayKey(t.datetime) === today);
  const weekTrades = trades.filter(t => weekKey(t.datetime) === currentWeek);

  const riskPerTrade$ = baseCapital * (activeAccount?.riskPerTradePct || 1) / 100;
  const dailyLimit$ = baseCapital * (activeAccount?.dailyLossLimitPct || 3) / 100;
  const weeklyLimit$ = baseCapital * (activeAccount?.weeklyLossLimitPct || 6) / 100;

  const openTrades = trades.filter(t => t.status === 'open');
  const openRisk = openTrades.reduce((s, t) => s + (getMetrics(t, instruments).risk$ || 0), 0);

  // Net daily and weekly drawdown (if net PnL for the day/week is negative, count how much of the limit is consumed)
  const todayNetPnL = todayTrades.filter(t => t.status === 'closed').reduce((s,t) => s + (getMetrics(t, instruments).net || 0), 0);
  const todayDrawdown = todayNetPnL < 0 ? Math.abs(todayNetPnL) : 0;

  const weekNetPnL = weekTrades.filter(t => t.status === 'closed').reduce((s,t) => s + (getMetrics(t, instruments).net || 0), 0);
  const weekDrawdown = weekNetPnL < 0 ? Math.abs(weekNetPnL) : 0;

  // Session stats
  const sessionStats = useMemo(() => {
    const out = { 'Asia':{n:0,w:0,pnl:0,R:0}, 'London':{n:0,w:0,pnl:0,R:0}, 'New York':{n:0,w:0,pnl:0,R:0}, 'Otra':{n:0,w:0,pnl:0,R:0} };
    filtered.forEach(t => {
      const s = out[t.session] || out['Otra'];
      const c = getMetrics(t, instruments);
      s.n++;
      if (c.net > 0) s.w++;
      s.pnl += c.net || 0;
      s.R += c.R || 0;
    });
    return out;
  }, [filtered, instruments]);

  // Group by asset & setup
  const byAsset = useMemo(() => {
    const m = {};
    filtered.forEach(t => {

// ============ EQUITY CHART ============
const EquityChart = ({curve, initialBalance}) => {
  const [hover, setHover] = useState(null);
  const w = 860, h = 260, pad = {l:68,r:60,t:20,b:30};
  if (!curve || curve.length < 2) {
    return <div className="empty-state">Sin operaciones cerradas suficientes para graficar</div>;
  }
  const eqs = curve.map(p => p.eq);
  const Rs = curve.map(p => p.R);
  const minEq = Math.min(...eqs, initialBalance), maxEq = Math.max(...eqs, initialBalance);
  const minR = Math.min(...Rs, 0), maxR = Math.max(...Rs, 0);
  const xScale = (i) => pad.l + (i / (curve.length-1)) * (w - pad.l - pad.r);
  const yEq = (v) => pad.t + (1 - (v - minEq) / Math.max(1e-6, maxEq - minEq)) * (h - pad.t - pad.b);
  const yR = (v) => pad.t + (1 - (v - minR) / Math.max(1e-6, maxR - minR || 1)) * (h - pad.t - pad.b);

  const pathEq = curve.map((p, i) => `${i===0?'M':'L'} ${xScale(i)} ${yEq(p.eq)}`).join(' ');
  const area = pathEq + ` L ${xScale(curve.length-1)} ${h-pad.b} L ${pad.l} ${h-pad.b} Z`;
  const pathR = curve.map((p, i) => `${i===0?'M':'L'} ${xScale(i)} ${yR(p.R)}`).join(' ');

  return (
    <div style={{position:'relative'}}>
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{maxHeight:260}}>
        <defs>
          <linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#f0b90b" stopOpacity="0.38"/>
            <stop offset="100%" stopColor="#f0b90b" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {[0,0.25,0.5,0.75,1].map(p => (
          <line key={p} x1={pad.l} x2={w-pad.r} y1={pad.t + p*(h-pad.t-pad.b)} y2={pad.t + p*(h-pad.t-pad.b)} stroke="#1b2735" strokeWidth="0.6" strokeDasharray="2,2" />
        ))}
        <line x1={pad.l} x2={w-pad.r} y1={yEq(initialBalance)} y2={yEq(initialBalance)} stroke="#f0b90b" strokeDasharray="4,4" strokeWidth="1" opacity="0.5" />
        <path d={area} fill="url(#eqGrad)" />
        <path d={pathEq} fill="none" stroke="#f0b90b" strokeWidth="2.2" />
        <path d={pathR} fill="none" stroke="#58a6ff" strokeWidth="1.5" strokeDasharray="3,3" />
        {hover && (
          <>
            <line x1={xScale(hover.i)} x2={xScale(hover.i)} y1={pad.t} y2={h-pad.b} stroke="#f0b90b" strokeWidth="1" opacity="0.6"/>
            <circle cx={xScale(hover.i)} cy={yEq(hover.p.eq)} r="4.5" fill="#f0b90b"/>
            <circle cx={xScale(hover.i)} cy={yR(hover.p.R)} r="3.5" fill="#58a6ff"/>
          </>
        )}
        {[0,0.5,1].map(p => {
          const v = minEq + p*(maxEq-minEq);
          return <text key={'l'+p} x={pad.l-6} y={yEq(v)+3} textAnchor="end" fill="#7d8aa0" fontSize="10" fontFamily="JetBrains Mono">{fmtMoney(v)}</text>;
        })}
        {[0,0.5,1].map(p => {
          const v = minR + p*(maxR-minR);
          return <text key={'r'+p} x={w-pad.r+6} y={yR(v)+3} textAnchor="start" fill="#7d8aa0" fontSize="10" fontFamily="JetBrains Mono">{v.toFixed(1)}R</text>;
        })}
        <rect x={pad.l} y={pad.t} width={w-pad.l-pad.r} height={h-pad.t-pad.b} fill="transparent"
          onMouseMove={(e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * w;
            const i = Math.round(((x - pad.l) / (w-pad.l-pad.r)) * (curve.length-1));
            const idx = Math.max(0, Math.min(curve.length-1, i));
            setHover({i:idx, p:curve[idx]});
          }}
          onMouseLeave={() => setHover(null)} />
      </svg>
      {hover && (
        <div className="absolute top-2 left-1/2 -translate-x-1/2 text-xs panel px-3 py-1.5 shadow-lg pointer-events-none">
          <span className="font-mono text-gold">#{hover.i}</span>
          {hover.p.asset && <span className="ml-1.5 font-semibold">{hover.p.asset}</span>}
          {hover.p.date && <span className="ml-1.5 text-slate-400">({hover.p.date})</span>} ·
          <span className="ml-2">Equidad <span className="font-mono font-semibold">{fmtMoney(hover.p.eq)}</span></span> ·
          <span className="ml-2">R Acum <span className="font-mono text-azure font-semibold">{hover.p.R.toFixed(2)}R</span></span>
        </div>
      )}
    </div>
  );
};

      if (!safeNum(form.entry)) e.entry = 'Requerido';

// ============ TRADE PREVIEW CHART (Lightweight Charts) ============
const TradePreviewChart = ({trade, instruments}) => {
  const ref = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!ref.current || !window.LightweightCharts) return;
    if (chartRef.current) { chartRef.current.remove(); chartRef.current = null; }

    const chart = LightweightCharts.createChart(ref.current, {
      width: ref.current.clientWidth,
      height: 260,
      layout: { background:{color:'#0a1017'}, textColor:'#7d8aa0', fontFamily:'JetBrains Mono', fontSize:10 },
      grid: { vertLines:{color:'#111a24'}, horzLines:{color:'#111a24'} },
      rightPriceScale: { borderColor:'#1b2735' },
      timeScale: { borderColor:'#1b2735', timeVisible:true },
      crosshair: { mode: 0 }
    });
    chartRef.current = chart;

    const seed = (trade.asset || 'X') + '|' + (trade.entry || 0) + '|' + (trade.stopLoss || 0);
    let hash = 0;
    for (let i=0;i<seed.length;i++) hash = ((hash<<5)-hash) + seed.charCodeAt(i);
    const rand = (s) => { s = Math.sin(s)*10000; return s - Math.floor(s); };

    const entry = safeNum(trade.entry, 100);
    const sl = safeNum(trade.stopLoss, entry*0.99);
    const tp = safeNum(trade.takeProfit, 0);
    const dir = trade.direction === 'SHORT' ? -1 : 1;
    const base = entry;
    const vol = Math.max(Math.abs(entry - sl) * 1.2, entry * 0.004);

    const series = chart.addCandlestickSeries({
      upColor:'#16c784', downColor:'#f6465d',
      borderUpColor:'#16c784', borderDownColor:'#f6465d',
      wickUpColor:'#16c784', wickDownColor:'#f6465d'
    });

    const data = [];
    const now = Math.floor(Date.now()/1000);
    for (let i=0;i<60;i++) {
      const t = now - (60-i)*3600;
      const r1 = rand(hash+i*1.1), r2 = rand(hash+i*2.3), r3 = rand(hash+i*3.7), r4 = rand(hash+i*5.1);
      const open = base + (r1-0.5)*vol;
      const close = open + (r2-0.5)*vol*1.2 + dir*vol*0.08;
      const high = Math.max(open,close) + r3*vol*0.4;
      const low = Math.min(open,close) - r4*vol*0.4;
      data.push({ time:t, open, high, low, close });
    }
    series.setData(data);

    const lastTime = data[data.length-1].time;
    const lines = [];

    if (entry > 0) lines.push({ price:entry, color:'#f0b90b', lineStyle:0, lineWidth:2, title:'ENTRADA', axisLabelVisible:true });
    if (sl > 0) lines.push({ price:sl, color:'#f6465d', lineStyle:2, lineWidth:2, title:'SL', axisLabelVisible:true });
    if (tp > 0) lines.push({ price:tp, color:'#16c784', lineStyle:1, lineWidth:2, title:'TP', axisLabelVisible:true });
    const exit = safeNum(trade.exit, 0);
    if (exit > 0 && trade.status === 'closed') {
      lines.push({ price:exit, color:'#58a6ff', lineStyle:3, lineWidth:2, title:'SALIDA', axisLabelVisible:true });
    }
    lines.forEach(l => series.createPriceLine(l));

    series.priceScale().applyOptions({ scaleMargins:{top:0.12, bottom:0.12} });
    chart.timeScale().setVisibleRange({ from: data[0].time, to: lastTime });

    const ro = new ResizeObserver(() => {
      if (ref.current && chartRef.current) chartRef.current.applyOptions({width:ref.current.clientWidth});
    });
    ro.observe(ref.current);

    return () => { ro.disconnect(); if (chartRef.current){ chartRef.current.remove(); chartRef.current=null; } };
  }, [trade.asset, trade.entry, trade.exit, trade.stopLoss, trade.takeProfit, trade.direction, trade.status]);

  return <div ref={ref} className="rounded-lg overflow-hidden border border-line" />;
};

// ============ HISTORIAL ============
const Historial = ({trades, instruments, onEdit, onInspect, onDelete}) => {
  const [search, setSearch] = useState('');
  const [statusF, setStatusF] = useState('all');
  const [dirF, setDirF] = useState('all');
  const [resultF, setResultF] = useState('all');
  const [sessF, setSessF] = useState('all');
  const [sortKey, setSortKey] = useState('datetime');
  const [sortDir, setSortDir] = useState('desc');
  const [confirmDel, setConfirmDel] = useState(null);

  const filtered = useMemo(() => {
    let arr = trades.slice();
    if (search) {
      const s = search.toLowerCase();
      arr = arr.filter(t =>
        (t.asset||'').toLowerCase().includes(s) ||
        (t.setup||'').toLowerCase().includes(s) ||
        (t.tags||'').toLowerCase().includes(s) ||
        (t.notes||'').toLowerCase().includes(s)
      );
    }
    if (statusF !== 'all') arr = arr.filter(t => t.status === statusF);
    if (dirF !== 'all') arr = arr.filter(t => t.direction === dirF);
    if (sessF !== 'all') arr = arr.filter(t => t.session === sessF);
    if (resultF !== 'all') {
      arr = arr.filter(t => {
        const c = getMetrics(t, instruments);
        if (resultF === 'win') return c.net > 0;
        if (resultF === 'loss') return c.net < 0;
        if (resultF === 'be') return c.net === 0;
        return true;
      });
    }
    arr.sort((a,b) => {
      let va, vb;
      if (sortKey === 'datetime') { va = new Date(a.datetime); vb = new Date(b.datetime); }
      else if (sortKey === 'asset') { va = a.asset; vb = b.asset; }
      else if (sortKey === 'size') { va = safeNum(a.size); vb = safeNum(b.size); }
      else if (sortKey === 'pnl') { va = getMetrics(a, instruments).net||0; vb = getMetrics(b, instruments).net||0; }
      else if (sortKey === 'r') { va = getMetrics(a, instruments).R||0; vb = getMetrics(b, instruments).R||0; }
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return arr;
  }, [trades, search, statusF, dirF, resultF, sessF, sortKey, sortDir, instruments]);

  const toggleSort = (k) => {
    if (sortKey === k) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(k); setSortDir('desc'); }
  };

  const totals = useMemo(() => {
    let pnl = 0, r = 0;
    filtered.forEach(t => {
      const c = getMetrics(t, instruments);
      pnl += c.net || 0;
      r += c.R || 0;
    });
    return { pnl, r };
  }, [filtered, instruments]);

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h1 className="font-display text-2xl font-bold">Historial de Operaciones</h1>
          <p className="text-xs text-slate-400 mt-0.5">Haz clic en cualquier fila o ícono de lupa para inspeccionar notas, métricas y capturas</p>
        </div>

const Calendario = ({trades, instruments, onInspectTrade, onEditTrade}) => {
  const [viewDate, setViewDate] = useState(new Date());
  const [selectedDayKey, setSelectedDayKey] = useState(null);
  const closed = useMemo(() => trades.filter(t => t.status === 'closed'), [trades]);

  const dailyMap = useMemo(() => {
    const m = {};
    closed.forEach(t => {
      const k = dayKey(t.datetime);
      if (!m[k]) m[k] = { pnl:0, n:0, R:0, trades:[] };
      const c = getMetrics(t, instruments);
      m[k].pnl += c.net || 0;
      m[k].n += 1;
      m[k].R += c.R || 0;
      m[k].trades.push(t);
    });
    return m;
  }, [closed, instruments]);

  const monthStart = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
  const monthEnd = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0);
  const startDay = (monthStart.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = monthEnd.getDate();

  const grid = [];
  for (let i=0;i<startDay;i++) grid.push(null);
  for (let d=1; d<=daysInMonth; d++) grid.push(d);
  while (grid.length % 7 !== 0) grid.push(null);

  const weeklyMap = useMemo(() => {
    const m = {};
    closed.forEach(t => {
      const k = weekKey(t.datetime);
      if (!m[k]) m[k] = { pnl:0, n:0, R:0 };
      const c = getMetrics(t, instruments);
      m[k].pnl += c.net || 0;
      m[k].n += 1;
      m[k].R += c.R || 0;
    });
    return Object.entries(m).sort((a,b) => b[0].localeCompare(a[0]));
  }, [closed, instruments]);

  const monthTrades = closed.filter(t => {
    const d = new Date(t.datetime);
    return d.getFullYear() === viewDate.getFullYear() && d.getMonth() === viewDate.getMonth();
  });
  const monthPnL = monthTrades.reduce((s,t) => s + (getMetrics(t, instruments).net || 0), 0);
  const monthR = monthTrades.reduce((s,t) => s + (getMetrics(t, instruments).R || 0), 0);
  const days = new Set(monthTrades.map(t => dayKey(t.datetime)));
  const dayStats = [...days].map(k => dailyMap[k]?.pnl || 0);
  const winDays = dayStats.filter(p => p > 0).length;
  const lossDays = dayStats.filter(p => p < 0).length;

  const maxAbs = Math.max(...Object.values(dailyMap).map(v => Math.abs(v.pnl)), 1);
  const today = dayKey(new Date());
  const selectedDayData = selectedDayKey ? dailyMap[selectedDayKey] : null;

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="font-display text-2xl font-bold">Calendario de Rendimiento</h1>
          <p className="text-xs text-slate-400 mt-0.5">Haz clic en cualquier día con actividad para auditar las operaciones de esa sesión</p>
        </div>
        <div className="flex items-center gap-2">
          <button className="btn btn-ghost btn-sm" onClick={() => setViewDate(new Date())}>Mes Actual</button>
          <button className="btn btn-ghost btn-sm btn-icon"
            onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1))}>
            <Ic name="chevron-left"/>
          </button>
          <div className="font-display font-semibold px-3 capitalize">
            {viewDate.toLocaleDateString('es-ES',{month:'long', year:'numeric'})}
          </div>
          <button className="btn btn-ghost btn-sm btn-icon"
            onClick={() => setViewDate(new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1))}>
            <Ic name="chevron-right"/>
          </button>
        </div>
      </div>

      <div className="panel p-4">
        <div className="grid grid-cols-7 gap-1.5 mb-2">
          {['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d => (
            <div key={d} className="text-center text-xs font-semibold text-slate-400 py-1">{d}</div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1.5">
          {grid.map((d, i) => {
            if (!d) return <div key={i} className="cal-day empty" />;
            const date = new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
            const k = dayKey(date);
            const data = dailyMap[k];
            const isToday = k === today;
            const pnl = data?.pnl || 0;
            const intensity = data ? Math.min(1, Math.abs(pnl)/maxAbs) : 0;
            const bg = data
              ? pnl >= 0
                ? `rgba(22,199,132,${0.12 + intensity*0.48})`
                : `rgba(246,70,93,${0.12 + intensity*0.48})`
              : 'transparent';
            return (
              <div
                key={i}
                onClick={() => data && setSelectedDayKey(k)}
                className={`cal-day ${isToday?'today':''}`}
                style={{background:bg}}>
                <div className="flex justify-between items-start">
                  <span className="font-mono text-xs text-slate-300">{d}</span>
                  {data && <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-night-950/60 text-slate-300">{data.n}T</span>}
                </div>
                {data && (
                  <>
                    <div className={`font-mono text-xs sm:text-sm font-bold mt-2 ${pnl>=0?'text-win':'text-loss'}`}>
                      {fmtMoney(pnl)}
                    </div>
                    <div className="text-[10px] text-gold font-mono mt-0.5">{data.R >= 0 ? '+' : ''}{fmtNum(data.R,2)}R</div>
                  </>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="panel p-5">
          <h3 className="font-display font-semibold mb-3">Resumen Mensual</h3>
          <div className="space-y-2.5 text-sm">
            <div className="flex justify-between">
              <span className="text-slate-400">PnL Neto del Mes</span>
              <span className={`font-mono font-semibold ${monthPnL>=0?'text-win':'text-loss'}`}>{fmtMoney(monthPnL)}</span>
            </div>
            <div className="flex justify-between">
              <span className="text-slate-400">R Neto Acumulado</span>
              <span className="font-mono text-gold font-semibold">{fmtNum(monthR,2)}R</span>
            </div>
            <div className="flex justify-between">
              <span className="text-slate-400">Días Ganadores / Perdedores</span>
              <span className="font-mono">
                <span className="text-win">{winDays}W</span> / <span className="text-loss">{lossDays}L</span>
              </span>
            </div>
            <div className="flex justify-between">
              <span className="text-slate-400">Win Rate Diario</span>
              <span className="font-mono">{(winDays + lossDays) > 0 ? fmtPct(winDays / (winDays + lossDays) * 100, 1) : '—'}</span>
            </div>
            <div className="flex justify-between">
              <span className="text-slate-400">Operaciones Totales</span>
              <span className="font-mono">{monthTrades.length}</span>
            </div>
          </div>
        </div>

        <div className="panel p-5 lg:col-span-2">
          <h3 className="font-display font-semibold mb-3">Rendimiento por Semana</h3>
          <div className="table-wrap max-h-64 overflow-y-auto">
            <table>
              <thead><tr>
                <th>Semana (Lunes)</th><th>Trades</th><th>R Neto</th><th>PnL Neto</th>
              </tr></thead>
              <tbody>
                {weeklyMap.length === 0 && <tr><td colSpan="4" className="empty-state">Sin datos</td></tr>}
                {weeklyMap.map(([k, v]) => (
                  <tr key={k}>
                    <td className="font-mono text-xs">w/c {k}</td>
                    <td className="font-mono">{v.n}</td>
                    <td className={`font-mono ${v.R>=0?'text-gold':'text-loss'}`}>{fmtNum(v.R,2)}R</td>
                    <td className={`font-mono font-semibold ${v.pnl>=0?'text-win':'text-loss'}`}>{fmtMoney(v.pnl)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      {/* Day Drill-Down Modal */}
      <Modal
        open={!!selectedDayKey && !!selectedDayData}
        onClose={() => setSelectedDayKey(null)}
        lg={true}
        title={`Operaciones del Día · ${selectedDayKey}`}>
        {selectedDayData && (
          <div className="space-y-4">
            <div className="flex items-center justify-between p-3 rounded-lg bg-night-900 border border-line text-xs">
              <span>Operaciones cerradas: <b className="font-mono">{selectedDayData.n}</b></span>
              <span>R Acumulado: <b className="font-mono text-gold">{fmtNum(selectedDayData.R, 2)}R</b></span>

// ============ QUANT LAB (FIXED MONTE CARLO & FAN CHART) ============
const Quant = ({trades, instruments, activeAccount, currentEquity, reviews, setReviews}) => {
  const closed = useMemo(() => trades.filter(t => t.status === 'closed'), [trades]);
  const Rs = useMemo(() => closed.map(t => getMetrics(t, instruments).R).filter(r => r != null && !isNaN(r)), [closed, instruments]);

  // A. Bootstrap de Expectativa
  const [bootRes, setBootRes] = useState(null);
  const runBootstrap = useCallback(() => {
    if (Rs.length < 5) return;
    const n = 2500;
    const obs = Rs.reduce((s,r) => s+r, 0) / Rs.length;
    const samples = [];
    for (let i=0;i<n;i++){
      let sum = 0;
      for (let j=0;j<Rs.length;j++){
        sum += Rs[Math.floor(Math.random()*Rs.length)];
      }
      samples.push(sum / Rs.length);
    }
    samples.sort((a,b) => a-b);
    const pct = (p) => samples[Math.min(samples.length - 1, Math.floor(p * samples.length))];
    setBootRes({
      obs,
      prob: samples.filter(x => x > 0).length / n,
      lo: pct(0.025),
      med: pct(0.50),
      hi: pct(0.975)
    });
  }, [Rs]);

  // B. Monte Carlo de Capital (FIXED independent sorting for Final Equity vs Max Drawdown + SVG Fan Chart)
  const [mc, setMc] = useState({
    sims: 1000, trades: 100, risk: activeAccount?.riskPerTradePct || 1, breach: 10
  });
  const [mcRes, setMcRes] = useState(null);

  const runMC = useCallback(() => {
    if (Rs.length < 2) return;
    const numSims = Math.max(100, Math.min(5000, mc.sims));
    const horizon = Math.max(10, Math.min(500, mc.trades));
    const useCompounding = mc.risk > 0;

    const finalEquities = [];
    const maxDrawdowns = [];
    let breachCount = 0;
    let lossCount = 0;

    // Matrix of trajectories per step to compute P5, P25, P50, P75, P95 fan chart
    const stepValues = Array.from({ length: horizon + 1 }, () => []);

    for (let i = 0; i < numSims; i++) {
      let eq = 1.0; // Normalized starting equity = 1.0 (100%)
      let peak = 1.0;
      let maxDD = 0;
      let breached = false;
      stepValues[0].push(useCompounding ? 100 : 0);

      for (let j = 1; j <= horizon; j++) {
        const r = Rs[Math.floor(Math.random() * Rs.length)];
        if (useCompounding) {
          eq = Math.max(0.0001, eq * (1 + (mc.risk / 100) * r));
          if (eq > peak) peak = eq;
          const ddPct = ((peak - eq) / peak) * 100;
          if (ddPct > maxDD) maxDD = ddPct;
          if (ddPct >= mc.breach) breached = true;
          stepValues[j].push(eq * 100);
        } else {
          eq += r; // Cumulative R mode
          if (eq > peak) peak = eq;
          const ddR = peak - eq;
          if (ddR > maxDD) maxDD = ddR;
          if (ddR >= mc.breach) breached = true;
          stepValues[j].push(eq);
        }
      }

      finalEquities.push(eq);
      maxDrawdowns.push(maxDD);
      if (breached) breachCount++;
      if ((useCompounding && eq < 1.0) || (!useCompounding && eq < 0)) lossCount++;
    }

    // FIXED BUG: Sort finalEquities and maxDrawdowns INDEPENDENTLY!
    finalEquities.sort((a, b) => a - b);
    maxDrawdowns.sort((a, b) => a - b);

    const pick = (arr, p) => arr[Math.min(arr.length - 1, Math.floor(p * arr.length))];

    // Build Fan Chart Band Series
    const fanBands = stepValues.map((arr, stepIdx) => {
      arr.sort((a, b) => a - b);
      return {
        step: stepIdx,
        p5: pick(arr, 0.05),
        p25: pick(arr, 0.25),
        p50: pick(arr, 0.50),
        p75: pick(arr, 0.75),
        p95: pick(arr, 0.95)
      };
    });

    setMcRes({
      useCompounding,
      p5: pick(finalEquities, 0.05),
      p50: pick(finalEquities, 0.50),
      p95: pick(finalEquities, 0.95),
      probLoss: lossCount / numSims,
      probBreach: breachCount / numSims,
      ddP50: pick(maxDrawdowns, 0.50),
      ddP95: pick(maxDrawdowns, 0.95),
      fanBands
    });
  }, [Rs, mc]);

  // Auto-run Bootstrap and Monte Carlo on first load if enough trades
  useEffect(() => {
    if (Rs.length >= 5 && !bootRes) runBootstrap();
    if (Rs.length >= 5 && !mcRes) runMC();
  }, [Rs.length]);

  // C. Heatmap horario
  const heatmap = useMemo(() => {
    const m = {};
    closed.forEach(t => {
      const d = new Date(t.datetime);
      const day = d.getDay();
      const hour = d.getHours();
      const k = `${day}|${hour}`;
      if (!m[k]) m[k] = {R:0, n:0};
      const c = getMetrics(t, instruments);
      m[k].R += c.R || 0;
      m[k].n++;
    });
    return m;
  }, [closed, instruments]);

  // D. Matriz comparativa
  const [mRow, setMRow] = useState('setup');
  const [mCol, setMCol] = useState('asset');
  const matrix = useMemo(() => {
    const getVal = (t, dim) => dim === 'setup' ? (t.setup || '—') : dim === 'asset' ? t.asset : (t.session || '—');
    const rows = [...new Set(closed.map(t => getVal(t, mRow)))];
    const cols = [...new Set(closed.map(t => getVal(t, mCol)))];
    const cells = {};
    closed.forEach(t => {
      const r = getVal(t, mRow), c = getVal(t, mCol);
      const k = `${r}|${c}`;
      if (!cells[k]) cells[k] = {n:0, pnl:0, R:0, w:0};
      const tc = getMetrics(t, instruments);
      cells[k].n++;
      cells[k].pnl += tc.net || 0;
      cells[k].R += tc.R || 0;
      if (tc.net > 0) cells[k].w++;
    });
    return {rows, cols, cells};
  }, [closed, instruments, mRow, mCol]);

  // E. Revisión semanal
  const weekOptions = useMemo(() => {
    const ws = new Set(closed.map(t => weekKey(t.datetime)).filter(Boolean));
    ws.add(weekKey(new Date()));
    return [...ws].sort().reverse();
  }, [closed]);
  const [selWeek, setSelWeek] = useState(() => weekOptions[0] || weekKey(new Date()));

  const weekTrades = closed.filter(t => weekKey(t.datetime) === selWeek);
  const weekStats = useMemo(() => {
    let pnl=0, R=0, w=0, plan=0;
    weekTrades.forEach(t => {
      const c = getMetrics(t, instruments);
      pnl += c.net || 0;
      R += c.R || 0;
      if (c.net > 0) w++;
      if (t.planFollowed) plan++;
    });
    return {pnl, R, w, plan, n: weekTrades.length};
  }, [weekTrades, instruments]);
  const currentReview = reviews[selWeek] || {grade:'', notes:'', lessons:''};
  const updateReview = (field, val) => {
    setReviews({ ...reviews, [selWeek]: {...currentReview, [field]: val} });
  };

  // Mini paneles
  const rDist = useMemo(() => {
    const bins = [
      {key:'≤-3', min:-Infinity, max:-3},
      {key:'-3/-2', min:-3, max:-2},
      {key:'-2/-1', min:-2, max:-1},
      {key:'-1/-0.5', min:-1, max:-0.5},
      {key:'-0.5/0', min:-0.5, max:0},
      {key:'0/0.5', min:0, max:0.5},
      {key:'0.5/1', min:0.5, max:1},
      {key:'1/1.5', min:1, max:1.5},
      {key:'1.5/2', min:1.5, max:2},
      {key:'2/3', min:2, max:3},
      {key:'≥3', min:3, max:Infinity}
    ];
    return bins.map(b => ({...b, count: Rs.filter(r => r >= b.min && r < b.max).length}));
  }, [Rs]);

  const rolling = useMemo(() => {
    const windows = [20, 50, 100, Rs.length];
    return windows.map(n => {
      const arr = Rs.slice(-Math.min(n, Rs.length));
      const wins = arr.filter(r => r > 0);
      const losses = arr.filter(r => r < 0);
      const gW = wins.reduce((s,r) => s+r, 0);
      const gL = Math.abs(losses.reduce((s,r) => s+r, 0));
      return {
        n: arr.length,
        wr: arr.length ? (wins.length/arr.length*100) : 0,
        pf: gL > 0 ? gW/gL : (gW > 0 ? Infinity : 0),
        avg: arr.length ? arr.reduce((s,r)=>s+r,0)/arr.length : 0
      };
    });
  }, [Rs]);

  const maeMfe = useMemo(() => {
    const valid = closed.map(t => getMetrics(t, instruments)).filter(c => c.maeR != null || c.mfeR != null);
    const maes = valid.filter(c => c.maeR != null).map(c => c.maeR);
    const mfes = valid.filter(c => c.mfeR != null).map(c => c.mfeR);
    const caps = valid.filter(c => c.capture != null).map(c => c.capture);
    const pains = valid.filter(c => c.pain != null).map(c => c.pain);
    const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0;
    return { mae: avg(maes), mfe: avg(mfes), capture: avg(caps), pain: avg(pains) };
  }, [closed, instruments]);

  const tagStats = useMemo(() => {
    const planYes = closed.filter(t => t.planFollowed);
    const planNo = closed.filter(t => !t.planFollowed);
    const pnlOf = (arr) => arr.reduce((s,t) => s + (getMetrics(t, instruments).net || 0), 0);
    const errs = {};

    closed.forEach(t => {

        if (!errs[e]) errs[e] = {n:0, pnl:0};
        errs[e].n++; errs[e].pnl += getMetrics(t, instruments).net || 0;
      });
      (t.tags||'').split(',').map(tg=>tg.trim()).filter(Boolean).forEach(tg => {
        if (!tags[tg]) tags[tg] = {n:0, pnl:0};
        tags[tg].n++; tags[tg].pnl += getMetrics(t, instruments).net || 0;
      });
    });
    return {
      planYes: {n: planYes.length, pnl: pnlOf(planYes)},
      planNo: {n: planNo.length, pnl: pnlOf(planNo)},
      topErrors: Object.entries(errs).sort((a,b)=>b[1].n-a[1].n).slice(0,5),

    };
  }, [closed, instruments]);

  return (

            <p className="text-xs text-slate-400">Estima la probabilidad real de que tu sistema posea ventaja estadística positiva (Edge &gt; 0)</p>
          </div>

// ============ MONTE CARLO FAN CHART ============
const MonteCarloFanChart = ({bands, useCompounding}) => {
  if (!bands || bands.length < 2) return null;
  const w = 840, h = 230, pad = {l:55, r:30, t:16, b:28};
  const allVals = bands.flatMap(b => [b.p5, b.p95]);
  const minV = Math.min(...allVals);
  const maxV = Math.max(...allVals);
  const range = Math.max(1e-6, maxV - minV);

  const xScale = (i) => pad.l + (i / (bands.length - 1)) * (w - pad.l - pad.r);
  const yScale = (v) => pad.t + (1 - (v - minV) / range) * (h - pad.t - pad.b);

  const buildArea = (topKey, botKey) => {
    const fwd = bands.map((b, i) => `${i===0?'M':'L'} ${xScale(i)} ${yScale(b[topKey])}`).join(' ');
    const rev = [...bands].reverse().map((b, idx) => {
      const i = bands.length - 1 - idx;
      return `L ${xScale(i)} ${yScale(b[botKey])}`;
    }).join(' ');
    return `${fwd} ${rev} Z`;
  };

  const p50Line = bands.map((b, i) => `${i===0?'M':'L'} ${xScale(i)} ${yScale(b.p50)}`).join(' ');
  const p95Line = bands.map((b, i) => `${i===0?'M':'L'} ${xScale(i)} ${yScale(b.p95)}`).join(' ');
  const p5Line = bands.map((b, i) => `${i===0?'M':'L'} ${xScale(i)} ${yScale(b.p5)}`).join(' ');

  const baseLevel = useCompounding ? 100 : 0;

  return (
    <div className="p-3 rounded-lg bg-night-950 border border-line">
      <div className="flex items-center justify-between text-[11px] text-slate-400 mb-2">
        <span>Cono de Incertidumbre Monte Carlo (Bandas P5–P95 y P25–P75)</span>
        <div className="flex gap-3 font-mono">
          <span className="text-win">── P95</span>
          <span className="text-gold">── Mediana P50</span>
          <span className="text-loss">── P5</span>
        </div>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{maxHeight:230}}>
        <path d={buildArea('p95', 'p5')} fill="rgba(240,185,11,0.08)" />
        <path d={buildArea('p75', 'p25')} fill="rgba(240,185,11,0.18)" />
        {baseLevel >= minV && baseLevel <= maxV && (
          <line x1={pad.l} x2={w-pad.r} y1={yScale(baseLevel)} y2={yScale(baseLevel)} stroke="#7d8aa0" strokeWidth="1" strokeDasharray="3,3" />
        )}
        <path d={p95Line} fill="none" stroke="#16c784" strokeWidth="1.3" strokeDasharray="3,2" />
        <path d={p50Line} fill="none" stroke="#f0b90b" strokeWidth="2.2" />
        <path d={p5Line} fill="none" stroke="#f6465d" strokeWidth="1.3" strokeDasharray="3,2" />
        {[0, 0.5, 1].map(p => {
          const v = minV + p * range;
          return (
            <text key={p} x={pad.l - 6} y={yScale(v) + 3} textAnchor="end" fill="#7d8aa0" fontSize="9" fontFamily="JetBrains Mono">
              {useCompounding ? `${v.toFixed(0)}%` : `${v.toFixed(0)}R`}
            </text>
          );
        })}
        <text x={w - pad.r} y={h - 6} textAnchor="end" fill="#7d8aa0" fontSize="9" fontFamily="JetBrains Mono">
          +{bands.length - 1} trades futuros
        </text>
      </svg>
    </div>
  );
};

  return (
    <div className="overflow-x-auto">
      <div className="min-w-[800px]">
        <div className="grid grid-cols-[60px_repeat(24,1fr)] gap-1">
          <div></div>
          {hours.map(h => (
            <div key={h} className="text-center text-[9px] text-slate-500 font-mono">{h}h</div>
          ))}
          {days.map((d, di) => (
            <Fragment key={d}>
              <div className="text-xs text-slate-400 flex items-center">{d}</div>
              {hours.map(h => {
                const k = `${di}|${h}`;
                const v = data[k] || {R:0, n:0};
                const intensity = Math.min(1, Math.abs(v.R) / max);
                const bg = v.n === 0
                  ? 'rgba(17,26,36,0.5)'
                  : v.R >= 0
                  ? `rgba(22,199,132,${0.15 + intensity*0.65})`
                  : `rgba(246,70,93,${0.15 + intensity*0.65})`;
                return (
                  <div key={h} className="heatcell" style={{background:bg}}
                    title={`${d} ${h}:00 · R ${fmtNum(v.R,2)} · ${v.n}T`}>
                    {v.n > 0 ? fmtNum(v.R, 1) : '·'}
                  </div>
                );
              })}
            </Fragment>
          ))}
        </div>
      </div>
    </div>
  );
};

const SyncIndicator = ({state, lastPush}) => {
  const labels = {
    disabled: 'Local Mode',
    idle: 'Sincronizado',
    syncing: 'Guardando…',
    ok: 'Sincronizado',
    error: 'API Offline',
    offline: 'Offline'
  };
  const css = state === 'syncing' ? 'syncing'
            : state === 'ok' ? 'ok'
            : state === 'error' || state === 'offline' ? 'offline'
            : state === 'disabled' ? 'disabled' : 'ok';
  const timeStr = lastPush
    ? new Date(lastPush).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})
    : '—';
  return (
    <div className={`sync-indicator ${css}`} title={`Última sync: ${timeStr}`}>
      <span className="dot"></span>
      <span className="txt hidden sm:inline">{labels[state] || state}</span>
    </div>
  );
};

const useAutoSync = (state, enabled, configured) => {
  const [syncState, setSyncState] = useState(configured ? 'idle' : 'disabled');
  const [syncLastPush, setSyncLastPush] = useState(null);
  const timerRef = useRef(null);
  const cooldownRef = useRef(0);
  const stateRef = useRef(state);
  stateRef.current = state;

  useEffect(() => {
    if (!enabled || !configured) {
      setSyncState('disabled');
      return;
    }
    setSyncState('idle');
  }, [enabled, configured]);

  useEffect(() => {
    if (!enabled || !configured) return;

    if (timerRef.current) clearTimeout(timerRef.current);

    const now = Date.now();
    const minDelay = Math.max(3000, 30000 - (now - cooldownRef.current));

    timerRef.current = setTimeout(async () => {
      setSyncState('syncing');
      try {
        const payload = {
          version: stateRef.current.version || 6,
          trades: stateRef.current.trades,
          accounts: stateRef.current.accounts,
          settings: stateRef.current.settings,
          instruments: stateRef.current.instruments,
          reviews: stateRef.current.reviews
        };
        await QLAPI.push(payload);
        setSyncState('ok');
        setSyncLastPush(Date.now());
        cooldownRef.current = Date.now();
      } catch (e) {
        console.warn('Auto-sync falló:', e.message);
        setSyncState('error');
      }
    }, Math.max(3000, minDelay));

    return () => { if (timerRef.current) clearTimeout(timerRef.current); };
  }, [state, enabled, configured]);

  return { syncState, syncLastPush };
};

// ============ PSICOLOGÍA ============
const Psicologia = ({trades, instruments, activeAccount}) => {
  const closed = useMemo(() => trades.filter(t => t.status === 'closed')
    .sort((a,b) => new Date(a.datetime) - new Date(b.datetime)), [trades]);

  const disciplina = useMemo(() => {
    if (!closed.length) return {score:0, plan:0, noErr:0, revenge:0, overDays:0, avgGap:0};
    const plan = closed.filter(t => t.planFollowed).length / closed.length;
    const noErr = closed.filter(t => !t.errors || !t.errors.trim()).length / closed.length;
    let revenge = 0;
    for (let i=1; i<closed.length; i++) {
      const prev = closed[i-1];
      const cur = closed[i];
      const prevC = getMetrics(prev, instruments);
      if (prevC.net < 0) {
        const diffMin = (new Date(cur.datetime) - new Date(prev.datetime)) / 60000;
        if (diffMin <= 15 && diffMin >= 0) revenge++;
      }
    }
    const revPct = closed.length > 1 ? 1 - (revenge / (closed.length - 1)) : 1;
    const dailyCount = {};
    closed.forEach(t => {
      const k = dayKey(t.datetime);
      dailyCount[k] = (dailyCount[k]||0) + 1;
    });
    const maxTrades = activeAccount?.maxTradesPerDay || 0;
    const overDays = maxTrades > 0 ? Object.values(dailyCount).filter(c => c > maxTrades).length : 0;
    const totalDays = Object.keys(dailyCount).length;
    const overPct = totalDays > 0 && maxTrades > 0 ? 1 - (overDays / totalDays) : 1;
    const gaps = [];
    for (let i=1; i<closed.length; i++) {
      gaps.push((new Date(closed[i].datetime) - new Date(closed[i-1].datetime)) / 3600000);
    }
    const avgGap = gaps.length ? gaps.reduce((s,g) => s+g, 0) / gaps.length : 0;
    const spacingScore = Math.min(1, avgGap / 12);

    const score = Math.round(
      plan*40 + noErr*20 + Math.max(0,revPct)*15 + Math.max(0,overPct)*15 + spacingScore*10
    );

    return {
      score,
      plan: plan*100,
      noErr: noErr*100,
      revenge,
      overDays,
      avgGap
    };
  }, [closed, instruments, activeAccount]);

  const gapHist = useMemo(() => {
    const gaps = [];
    for (let i=1; i<closed.length; i++) {
      gaps.push((new Date(closed[i].datetime) - new Date(closed[i-1].datetime)) / 3600000);
    }
    const buckets = [
      {key:'<1h', min:0, max:1},
      {key:'1-4h', min:1, max:4},
      {key:'4-12h', min:4, max:12},
      {key:'12-24h', min:12, max:24},
      {key:'1-3d', min:24, max:72},
      {key:'>3d', min:72, max:Infinity}
    ];
    return buckets.map(b => ({
      ...b,
      count: gaps.filter(g => g >= b.min && g < b.max).length
    }));
  }, [closed]);

  const [sigDim, setSigDim] = useState('session');
  const significance = useMemo(() => {
    const getVal = (t) => sigDim === 'session' ? (t.session || 'Otra') : sigDim === 'setup' ? (t.setup || '—') : t.asset;
    const groups = {};
    closed.forEach(t => {
      const k = getVal(t);
      if (!groups[k]) groups[k] = [];
      const c = getMetrics(t, instruments);
      if (c.R != null) groups[k].push(c.R);
    });
    return Object.entries(groups).map(([name, rs]) => {
      const n = rs.length;
      const mean = n ? rs.reduce((s,r)=>s+r,0)/n : 0;
      const variance = n > 1 ? rs.reduce((s,r) => s + (r-mean)**2, 0) / (n-1) : 0;
      const std = Math.sqrt(variance);
      const tStat = n > 0 && std > 0 ? mean / (std / Math.sqrt(n)) : 0;
      return { name, n, mean, std, tStat, sig: Math.abs(tStat) >= 1.96 };
    }).sort((a,b) => b.mean - a.mean);
  }, [closed, instruments, sigDim]);

  const eqCurve = useMemo(() => {
    let eq = activeAccount?.initialBalance || 10000;
    let peak = eq;
    const pts = [{eq, dd:0}];
    closed.forEach(t => {
      const c = getMetrics(t, instruments);
      eq += c.net || 0;
      if (eq > peak) peak = eq;
      const dd = peak > 0 ? (peak - eq) / peak * 100 : 0;
      pts.push({eq, dd});
    });
    return pts;
  }, [closed, instruments, activeAccount]);

  const rollingExp = useMemo(() => {
    const rs = closed.map(t => getMetrics(t, instruments).R).filter(r => r != null);
    if (rs.length < 20) return [];
    const result = [];
    for (let i = 19; i < rs.length; i++) {
      const window = rs.slice(i-19, i+1);
      result.push(window.reduce((s,r) => s+r, 0) / 20);
    }
    return result;
  }, [closed, instruments]);

  const rPercentiles = useMemo(() => {
    const sorted = [...closed.map(t => getMetrics(t, instruments).R).filter(r => r != null)].sort((a,b)=>a-b);
    return { sorted };
  }, [closed, instruments]);

  const scatterData = useMemo(() => {
    return closed.map(t => {
      const c = getMetrics(t, instruments);
      return { mfe: c.mfeR, r: c.R, net: c.net };
    }).filter(d => d.mfe != null && d.r != null);
  }, [closed, instruments]);

  const scoreColor = disciplina.score >= 75 ? '#16c784' : disciplina.score >= 50 ? '#f0b90b' : '#f6465d';

  return (
    <div className="space-y-6">
      <div>
        <h1 className="font-display text-2xl font-bold">Psicología & Conducta Cuantitativa</h1>
        <p className="text-xs text-slate-400 mt-0.5">Auditoría de sesgos cognitivos, revenge trading, overtrading y pruebas t-Student por grupo</p>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="panel p-5 flex flex-col items-center justify-center">
          <h3 className="font-display font-semibold mb-3">Índice Global de Disciplina</h3>
          <DisciplineGauge score={disciplina.score} color={scoreColor} />
        </div>

        <div className="panel p-5 lg:col-span-2">
          <h3 className="font-display font-semibold mb-3">Biometría Conductual Detectada</h3>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            <StatCard label="% Plan Respetado" value={fmtPct(disciplina.plan,1)} color="#16c784" />
            <StatCard label="% Ejecución Limpia" value={fmtPct(disciplina.noErr,1)} color="#58a6ff" />
            <StatCard label="Revenge Trades (≤15m)" value={disciplina.revenge} color="#f6465d" />
            <StatCard label="Días Overtrading" value={disciplina.overDays} color="#f6465d" />
            <StatCard label="Pausa Media entre Trades" value={fmtNum(disciplina.avgGap,1)+'h'} color="#f0b90b" />
            <StatCard label="Muestra Auditada" value={`${closed.length} trades`} color="#9aa8bd" />
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="panel p-5">
          <h3 className="font-display font-semibold mb-3">Frecuencia de Pausas entre Operaciones</h3>
          <GapHistogram data={gapHist} />
        </div>

        <div className="panel p-5">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-display font-semibold">Significancia Estadística (t-Test)</h3>
            <select className="input" style={{width:130}} value={sigDim} onChange={e => setSigDim(e.target.value)}>
              <option value="session">Por Sesión</option>
              <option value="setup">Por Setup</option>
              <option value="asset">Por Activo</option>
            </select>
          </div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Grupo</th><th>n</th><th>Media R̄</th><th>Desv σ</th><th>t-Stat</th><th>Veredicto (95%)</th></tr></thead>
              <tbody>
                {significance.map(g => (
                  <tr key={g.name}>
                    <td className="font-semibold">{g.name}</td>
                    <td className="font-mono">{g.n}</td>
                    <td className={`font-mono ${g.mean>=0?'text-gold':'text-loss'}`}>{fmtNum(g.mean,2)}R</td>
                    <td className="font-mono">{fmtNum(g.std,2)}</td>
                    <td className="font-mono">{fmtNum(g.tStat,2)}</td>
                    <td>
                      {g.sig
                        ? <span className={`badge ${g.mean>0?'badge-win':'badge-loss'}`}>{g.mean>0?'EDGE SIGNIFICATIVO':'FUGA SIGNIFICATIVA'}</span>
                        : <span className="badge badge-planned">RUIDO / MUESTRA BAJA</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="panel p-5">
          <h3 className="font-display font-semibold mb-3">Curva Underwater (Drawdown %)</h3>
          <DrawdownChart curve={eqCurve} />
        </div>

        <div className="panel p-5">
          <h3 className="font-display font-semibold mb-3">Expectativa Móvil (Ventana 20 Trades)</h3>
          <RollingExpectancyChart data={rollingExp} />
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="panel p-5">
          <h3 className="font-display font-semibold mb-3">Histograma de Múltiplos R</h3>
          <RDistChart data={rPercentiles.sorted} />
        </div>

        <div className="panel p-5">
          <h3 className="font-display font-semibold mb-3">Dispersión de Captura (MFE vs R Neto Final)</h3>
          <CaptureScatter data={scatterData} />
        </div>
      </div>
    </div>
  );
};

const DisciplineGauge = ({score, color}) => {
  const size = 180, stroke = 14;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (score / 100) * c;
  return (
    <div style={{position:'relative', width:size, height:size}}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} stroke="#1b2735" strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={offset}
          className="gauge-arc" transform={`rotate(-90 ${size/2} ${size/2})`}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        <div className="font-display font-bold text-4xl" style={{color}}>{score}</div>
        <div className="text-xs text-slate-400">/ 100 PTS</div>
      </div>
    </div>
  );
};

const GapHistogram = ({data}) => {
  const max = Math.max(...data.map(d => d.count), 1);
  return (
    <div className="space-y-2">
      {data.map(b => {
        const h = (b.count / max) * 100;
        return (
          <div key={b.key} className="flex items-center gap-2">
            <div className="w-14 text-xs text-slate-400 font-mono">{b.key}</div>
            <div className="flex-1 h-6 bg-night-900 rounded overflow-hidden relative">
              <div className="h-full bg-azure" style={{width:h+'%'}} />
              {b.count > 0 && <span className="absolute inset-0 flex items-center justify-center text-xs font-mono">{b.count}</span>}
            </div>
          </div>
        );
      })}
    </div>
  );
};

const DrawdownChart = ({curve}) => {
  const w = 600, h = 200, pad = {l:44, r:10, t:10, b:20};
  if (curve.length < 2) return <div className="empty-state">Sin datos</div>;
  const dds = curve.map(p => p.dd);
  const maxDD = Math.max(...dds, 0.01);
  const xScale = (i) => pad.l + (i / (curve.length-1)) * (w - pad.l - pad.r);
  const yScale = (v) => pad.t + (v / maxDD) * (h - pad.t - pad.b);
  const path = curve.map((p, i) => `${i===0?'M':'L'} ${xScale(i)} ${yScale(p.dd)}`).join(' ');
  const area = path + ` L ${xScale(curve.length-1)} ${pad.t} L ${pad.l} ${pad.t} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{maxHeight:200}}>
      <path d={area} fill="rgba(246,70,93,0.28)"/>
      <path d={path} fill="none" stroke="#f6465d" strokeWidth="1.6"/>
      <line x1={pad.l} x2={w-pad.r} y1={pad.t} y2={pad.t} stroke="#f0b90b" strokeWidth="1" strokeDasharray="2,2"/>
      <text x={pad.l-4} y={pad.t+4} textAnchor="end" fill="#7d8aa0" fontSize="9" fontFamily="JetBrains Mono">0%</text>
      <text x={pad.l-4} y={h-pad.b+4} textAnchor="end" fill="#7d8aa0" fontSize="9" fontFamily="JetBrains Mono">-{maxDD.toFixed(1)}%</text>
    </svg>
  );
};

const RollingExpectancyChart = ({data}) => {
  const w = 600, h = 200, pad = {l:44, r:10, t:10, b:20};
  if (data.length < 2) return <div className="empty-state">Necesitas al menos 20 trades cerrados</div>;
  const min = Math.min(...data, 0);
  const max = Math.max(...data, 0);
  const range = max - min || 1;
  const xScale = (i) => pad.l + (i / (data.length-1)) * (w - pad.l - pad.r);
  const yScale = (v) => pad.t + (1 - (v - min) / range) * (h - pad.t - pad.b);
  const path = data.map((v, i) => `${i===0?'M':'L'} ${xScale(i)} ${yScale(v)}`).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{maxHeight:200}}>
      <line x1={pad.l} x2={w-pad.r} y1={yScale(0)} y2={yScale(0)} stroke="#f0b90b" strokeWidth="1" strokeDasharray="2,2"/>
      <path d={path} fill="none" stroke="#58a6ff" strokeWidth="2"/>
      <text x={pad.l-4} y={yScale(0)+4} textAnchor="end" fill="#7d8aa0" fontSize="9" fontFamily="JetBrains Mono">0R</text>
    </svg>
  );
};

const RDistChart = ({data}) => {
  const w = 600, h = 200, pad = {l:30, r:10, t:10, b:30};
  if (!data || data.length < 2) return <div className="empty-state">Sin datos</div>;
  const bins = [
    {key:'≤-3', min:-Infinity, max:-3},
    {key:'-3/-2', min:-3, max:-2},
    {key:'-2/-1', min:-2, max:-1},
    {key:'-1/-0.5', min:-1, max:-0.5},
    {key:'-0.5/0', min:-0.5, max:0},
    {key:'0/0.5', min:0, max:0.5},
    {key:'0.5/1', min:0.5, max:1},
    {key:'1/1.5', min:1, max:1.5},
    {key:'1.5/2', min:1.5, max:2},
    {key:'2/3', min:2, max:3},
    {key:'≥3', min:3, max:Infinity}
  ];
  const counts = bins.map(b => ({...b, c: data.filter(r => r >= b.min && r < b.max).length}));
  const max = Math.max(...counts.map(x => x.c), 1);
  const bw = (w - pad.l - pad.r) / counts.length;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{maxHeight:200}}>
      {counts.map((b, i) => {
        const x = pad.l + i*bw;
        const hBar = (b.c / max) * (h - pad.t - pad.b);
        return (
          <g key={b.key}>
            <rect x={x+2} y={h - pad.b - hBar} width={bw-4} height={hBar} fill={b.min >= 0 ? '#16c784' : '#f6465d'} opacity="0.75"/>
            <text x={x+bw/2} y={h-pad.b+12} textAnchor="middle" fill="#7d8aa0" fontSize="8" fontFamily="JetBrains Mono">{b.key}</text>
          </g>
        );
      })}
    </svg>
  );
};

const CaptureScatter = ({data}) => {
  const w = 600, h = 240, pad = {l:40, r:20, t:20, b:30};
  if (!data || data.length < 1) return <div className="empty-state">Sin datos MFE/R</div>;
  const mfes = data.map(d => d.mfe);
  const rs = data.map(d => d.r);
  const maxMFE = Math.max(...mfes, 1);
  const minR = Math.min(...rs, 0);
  const maxR = Math.max(...rs, 1);
  const rangeR = maxR - minR || 1;
  const xScale = (v) => pad.l + (v / maxMFE) * (w - pad.l - pad.r);
  const yScale = (v) => pad.t + (1 - (v - minR) / rangeR) * (h - pad.t - pad.b);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{maxHeight:240}}>
      <line x1={pad.l} x2={w-pad.r} y1={yScale(0)} y2={yScale(0)} stroke="#1b2735" strokeWidth="1"/>
      <line x1={pad.l} y1={yScale(0)} x2={xScale(Math.min(maxMFE, maxR))} y2={yScale(Math.min(maxMFE, maxR))} stroke="#f0b90b" strokeWidth="1" strokeDasharray="4,4"/>
      {data.map((d, i) => (
        <circle key={i} cx={xScale(d.mfe)} cy={yScale(d.r)} r="3.5"
          fill={d.r >= 0 ? '#16c784' : '#f6465d'} opacity="0.85"/>
      ))}
      <text x={w-pad.r} y={h-pad.b+14} textAnchor="end" fill="#7d8aa0" fontSize="9" fontFamily="JetBrains Mono">MFE R</text>
      <text x={pad.l-4} y={pad.t} textAnchor="end" fill="#7d8aa0" fontSize="9" fontFamily="JetBrains Mono">R Neto</text>
    </svg>
  );
};
