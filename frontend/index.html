      setState(normalized);
      toast(`Importados ${normalized.trades.length} trades exitosamente`, 'ok');
    } catch(err) { toast('Error JSON: ' + err.message, 'err'); }
    e.target.value = '';
  };

  const exportCSV = () => {
    const cols = ['id','datetime','cuenta','activo','estado','direccion','entrada','salida','stopLoss','takeProfit','tamano','comision','multiplicador','setup','sesion','tags','errores','emocion','planSeguido','A+','maePrecio','mfePrecio','pnlNeto','rNeto','rBruto','riesgo','notas'];
    const rows = [cols.join(',')];
    state.trades.forEach(t => {
      const acc = accounts.find(a => a.id === t.accountId);
      const c = getMetrics(t, instruments);
      rows.push([
        t.id, t.datetime, acc?.name || '', t.asset, t.status, t.direction,
        t.entry, t.exit, t.stopLoss, t.takeProfit, t.size, t.commission, c.mult,
        t.setup, t.session, t.tags, t.errors, t.emotions,
        t.planFollowed ? '1' : '0', t.aplus ? '1' : '0',
        t.maePrice, t.mfePrice, c.net, c.R, c.grossR, c.risk$, t.notes
      ].map(csvEscape).join(','));
    });
    const blob = new Blob(['\ufeff' + rows.join('\n')], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `quantlog-v1-${dayKey(new Date())}.csv`; a.click();
    URL.revokeObjectURL(url);
    toast('CSV exportado', 'ok');
  };

  const importCSV = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const rows = parseCSV(text);
      const mapped = autoMapCSV(rows);
      const existingHashes = new Set(state.trades.map(hashTrade));
      const seen = new Set();
      const newTrades = [];
      mapped.forEach(m => {
        const t = {
          id: uid(),
          createdAt: new Date().toISOString(),
          accountId: state.settings.activeAccountId || accounts[0]?.id,
          datetime: m.datetime,
          asset: (m.asset || '').toUpperCase(),
          direction: (m.direction || 'LONG').toUpperCase(),
          status: m.status || 'closed',
          entry: safeNum(m.entry),
          exit: safeNum(m.exit) || '',
          stopLoss: safeNum(m.stopLoss),
          takeProfit: safeNum(m.takeProfit),
          size: safeNum(m.size, 1),
          commission: safeNum(m.commission, 0),
          setup: m.setup || '',
          session: m.session || '',
          tags: m.tags || '',
          errors: m.errors || '',
          emotions: m.emotions || '',
          planFollowed: !!(m.planFollowed && ['1','true','si','sí','yes','y'].includes(String(m.planFollowed).toLowerCase())),
          aplus: !!(m.aplus && ['1','true','si','sí','yes','y'].includes(String(m.aplus).toLowerCase())),
          maePrice: safeNum(m.maePrice) || '',
          mfePrice: safeNum(m.mfePrice) || '',
          notes: m.notes || '',
          screenshotId: ''
        };
        if (!t.asset || !t.datetime) return;
        if (t.status === 'closed' && (!t.entry || !t.exit || !t.stopLoss)) return;
        if ((t.status === 'open' || t.status === 'planned') && (!t.entry || !t.stopLoss)) return;
        const h = hashTrade(t);
        if (existingHashes.has(h) || seen.has(h)) return;
        seen.add(h);
        newTrades.push(t);
      });
      setState(s => ({ ...s, trades: [...s.trades, ...newTrades] }));
      toast(`Importados ${newTrades.length} trades nuevos de ${mapped.length} filas`, 'ok');
    } catch(err) { toast('Error CSV: ' + err.message, 'err'); }
    e.target.value = '';
  };

  const requestLoadDemo = () => {
    setConfirmAction({
      title: 'Cargar Dataset Demo Institucional',
      message: '¿Deseas cargar los 46 trades simulados de demostración? Esto reemplazará las operaciones actuales en memoria.',
      danger: false,
      onConfirm: () => {
        setState(generateDemo());
        toast('Demo cargada (46 trades)', 'ok');
        setConfirmAction(null);
      }
    });
  };

  const requestWipeAll = () => {
    setConfirmAction({
      title: '⚠ Borrar Todos los Datos',
      message: 'Esto eliminará permanentemente todos los trades, cuentas, instrumentos, revisiones semanales y capturas de IndexedDB. ¿Confirmas la operación?',
      danger: true,
      onConfirm: async () => {
        try {
          const db = await openDB();
          const tx = db.transaction(DB_STORE, 'readwrite');
          tx.objectStore(DB_STORE).clear();
        } catch(e) { console.warn('DB clear failed', e); }
        setState({
          version: 6,
          trades: [],
          accounts: [{ id:'acc-default', name:'Principal', initialBalance:10000, riskPerTradePct:1, dailyLossLimitPct:3, weeklyLossLimitPct:6, maxTradesPerDay:5, riskBaseMode:'current', createdAt:new Date().toISOString() }],
          settings: { activeAccountId: 'acc-default' },
          instruments: [
            { symbol:'EURUSD', multiplier:100000, pipSize:0.0001 },
            { symbol:'XAUUSD', multiplier:100, pipSize:0.01 },
            { symbol:'NAS100', multiplier:1, pipSize:0.01 }
          ],
          reviews: {}
        });
        toast('Todos los datos fueron reiniciados', 'info');
        setConfirmAction(null);
      }
    });
  };

  const saveAccount = (acc) => {
    setState(s => {
      const exists = s.accounts.find(a => a.id === acc.id);
      const nextAccounts = exists
        ? s.accounts.map(a => a.id === acc.id ? acc : a)
        : [...s.accounts, acc];
      return { ...s, accounts: nextAccounts };
    });
    setShowAccModal(null);
    toast('Cuenta guardada', 'ok');
  };

  const requestDeleteAccount = (id) => {
    if (accounts.length <= 1) { toast('Debe existir al menos una cuenta activa', 'err'); return; }
    const other = accounts.find(a => a.id !== id);
    setConfirmAction({
      title: 'Eliminar Cuenta',
      message: `¿Eliminar esta cuenta? Sus operaciones registradas se reasignarán automáticamente a "${other.name}".`,
      danger: true,
      onConfirm: () => {
        setState(s => ({
          ...s,
          accounts: s.accounts.filter(a => a.id !== id),
          trades: s.trades.map(t => t.accountId === id ? {...t, accountId: other.id} : t),
          settings: { ...s.settings, activeAccountId: s.settings.activeAccountId === id ? other.id : s.settings.activeAccountId }
        }));
        toast('Cuenta eliminada', 'info');
        setConfirmAction(null);
      }
    });
  };

  const saveInstrument = (inst) => {
    setState(s => {
      const exists = s.instruments.find(i => i.symbol === inst.symbol);
      const nextInst = exists
        ? s.instruments.map(i => i.symbol === inst.symbol ? inst : i)
        : [...s.instruments, inst];
      return { ...s, instruments: nextInst };
    });
    setShowInstModal(null);
    toast('Instrumento guardado', 'ok');
  };

  const requestDeleteInstrument = (symbol) => {
    setConfirmAction({
      title: `Eliminar Instrumento ${symbol}`,
      message: `¿Seguro que deseas eliminar la configuración de multiplicador para ${symbol}?`,
      danger: true,
      onConfirm: () => {
        setState(s => ({ ...s, instruments: s.instruments.filter(i => i.symbol !== symbol) }));
        toast('Instrumento eliminado', 'info');
        setConfirmAction(null);
      }
    });
  };

  const saveApiCfg = () => {
    QLAPI.save(apiCfg);
    toast('Configuración API guardada', 'ok');
  };

  const testApi = async () => {
    setApiBusy(b => ({...b, test:true}));
    try {
      const r = await QLAPI.health();
      setApiStatus({ok:true, msg:'OK: ' + JSON.stringify(r)});
    } catch(e) {
      setApiStatus({ok:false, msg:'Error: ' + e.message});
    }
    setApiBusy(b => ({...b, test:false}));
  };

  const pullApi = async () => {
    setApiBusy(b => ({...b, pull:true}));
    try {
      const data = await QLAPI.pull();
      setState(data);
      toast(`Pull exitoso: ${data.trades.length} trades`, 'ok');
    } catch(e) {
      setApiStatus({ok:false, msg:'Pull falló: ' + e.message});
      toast('Pull falló: ' + e.message, 'err');
    }
    setApiBusy(b => ({...b, pull:false}));
  };

  const pushApi = async () => {
    setApiBusy(b => ({...b, push:true}));
    try {
      const r = await QLAPI.push(state);
      setApiStatus({ok:true, msg:'Push exitoso: ' + JSON.stringify(r)});
      toast('Push exitoso ✓', 'ok');
    } catch(e) {
      setApiStatus({ok:false, msg:'Push falló: ' + e.message});
      toast('Push falló: ' + e.message, 'err');
    }
    setApiBusy(b => ({...b, push:false}));
  };

  return (
    <div className="space-y-6">
      <div>
        <h1 className="font-display text-2xl font-bold">Datos, Cuentas & Sincronización API</h1>
        <p className="text-xs text-slate-400 mt-0.5">Gestión de respaldos JSON/CSV, cuentas multi-riesgo, multiplicadores y conexión FastAPI / MariaDB</p>
      </div>

      <div className="panel p-5">
        <h3 className="font-display font-semibold mb-3">A. Respaldos Locales e Importación</h3>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          <div className="p-3 rounded-lg bg-night-900 border border-line"><div className="lbl">Trades Totales</div><div className="font-mono text-lg">{state.trades.length}</div></div>
          <div className="p-3 rounded-lg bg-night-900 border border-line"><div className="lbl">Cuentas</div><div className="font-mono text-lg">{state.accounts.length}</div></div>
          <div className="p-3 rounded-lg bg-night-900 border border-line"><div className="lbl">Instrumentos</div><div className="font-mono text-lg">{state.instruments.length}</div></div>
          <div className="p-3 rounded-lg bg-night-900 border border-line"><div className="lbl">Memoria Local</div><div className="font-mono text-lg text-gold">{lsSize}</div></div>
        </div>
        <div className="flex flex-wrap gap-2">
          <button className="btn btn-gold" onClick={exportJSON}><Ic name="download" className="icon-sm"/> Exportar JSON</button>
          <label className="btn btn-ghost cursor-pointer"><Ic name="upload" className="icon-sm"/> Importar JSON<input type="file" accept=".json" onChange={importJSON} className="hidden"/></label>
          <button className="btn btn-ghost" onClick={exportCSV}><Ic name="file-spreadsheet" className="icon-sm"/> Exportar CSV</button>
          <label className="btn btn-ghost cursor-pointer"><Ic name="file-up" className="icon-sm"/> Importar CSV<input type="file" accept=".csv,.txt" onChange={importCSV} className="hidden"/></label>
          <button className="btn btn-ghost" onClick={requestLoadDemo}><Ic name="sparkles" className="icon-sm"/> Restaurar Demo (46T)</button>
          <button className="btn btn-danger ml-auto" onClick={requestWipeAll}><Ic name="trash-2" className="icon-sm"/> Reiniciar Todo</button>
        </div>
      </div>

      {/* Cuentas */}
      <div className="panel p-5">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-display font-semibold">B. Cuentas y Parámetros de Riesgo</h3>
          <button className="btn btn-gold btn-sm" onClick={() => setShowAccModal({
            id: uid(), name:'', initialBalance:10000, riskPerTradePct:1,
            dailyLossLimitPct:3, weeklyLossLimitPct:6, maxTradesPerDay:5,
            riskBaseMode:'current', createdAt: new Date().toISOString()
          })}><Ic name="plus" className="icon-sm"/> Nueva Cuenta</button>
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th>Nombre</th><th>Balance Inicial</th><th>Equidad Actual</th><th>Trades</th>
              <th>Riesgo/T</th><th>Límite Día</th><th>Límite Sem</th><th>Max T/Día</th><th>Modo Riesgo</th><th></th>
            </tr></thead>
            <tbody>
              {accounts.map(a => {
                const tr = state.trades.filter(t => t.accountId === a.id);
                const pnl = tr.filter(t => t.status === 'closed').reduce((s,t) => s + (getMetrics(t, instruments).net||0), 0);
                const eq = (a.initialBalance || 0) + pnl;
                return (
                  <tr key={a.id}>
                    <td className="font-semibold">{a.name}</td>
                    <td className="font-mono">{fmtMoney(a.initialBalance)}</td>
                    <td className={`font-mono font-semibold ${eq >= a.initialBalance ? 'text-win' : 'text-loss'}`}>{fmtMoney(eq)}</td>
                    <td className="font-mono">{tr.length}</td>
                    <td className="font-mono text-gold">{a.riskPerTradePct}%</td>
                    <td className="font-mono">{a.dailyLossLimitPct}%</td>
                    <td className="font-mono">{a.weeklyLossLimitPct}%</td>
                    <td className="font-mono">{a.maxTradesPerDay}</td>
                    <td><span className="badge badge-be">{a.riskBaseMode === 'initial' ? 'Estático' : 'Compuesto'}</span></td>
                    <td>
                      <div className="flex gap-1">
                        <button className="btn btn-ghost btn-sm btn-icon" onClick={() => setShowAccModal(a)}><Ic name="pencil" className="icon-sm"/></button>
                        <button className="btn btn-danger btn-sm btn-icon" onClick={() => requestDeleteAccount(a.id)}><Ic name="trash-2" className="icon-sm"/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Instrumentos */}
      <div className="panel p-5">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-display font-semibold">C. Especificaciones de Instrumentos y Multiplicadores</h3>
          <button className="btn btn-gold btn-sm" onClick={() => setShowInstModal({symbol:'', multiplier:1, pipSize:''})}><Ic name="plus" className="icon-sm"/> Nuevo Instrumento</button>
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Símbolo</th><th>Multiplicador Contractual</th><th>Pip / Tick Size</th><th></th></tr></thead>
            <tbody>
              {state.instruments.length === 0 && <tr><td colSpan="4" className="empty-state">Sin instrumentos configurados</td></tr>}
              {state.instruments.map(i => (
                <tr key={i.symbol}>
                  <td className="font-mono font-semibold">{i.symbol}</td>
                  <td className="font-mono">{i.multiplier}</td>
                  <td className="font-mono">{i.pipSize || '—'}</td>
                  <td>
                    <div className="flex gap-1 justify-end">
                      <button className="btn btn-ghost btn-sm btn-icon" onClick={() => setShowInstModal(i)}><Ic name="pencil" className="icon-sm"/></button>
                      <button className="btn btn-danger btn-sm btn-icon" onClick={() => requestDeleteInstrument(i.symbol)}><Ic name="trash-2" className="icon-sm"/></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Backend/API */}
      <div className="panel p-5">
        <h3 className="font-display font-semibold mb-2">D. Sincronización Backend / REST API <span className="badge badge-open ml-2">Compatible v1/v1</span></h3>
        <p className="text-xs text-slate-400 mb-4">
          Sincroniza automáticamente tu estado con tu servidor local FastAPI / MariaDB mediante los endpoints <code className="text-gold">/api/v1/health</code> y <code className="text-gold">/api/v1/state</code>.
        </p>
        {apiConfigured && (
          <label className="flex items-center gap-3 p-3 rounded-lg mb-4 cursor-pointer bg-night-900 border border-line">
            <input type="checkbox" checked={autoSyncEnabled} onChange={toggleAutoSync} />
            <div>
              <div className="font-semibold text-sm">Auto-Sync Transaccional Activo</div>
              <div className="text-xs text-slate-400 mt-0.5">
                Ejecuta PUT /api/v1/state 3 segundos después de cada cambio detectado.
              </div>
            </div>
          </label>
        )}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
          <div>
            <div className="lbl">API Base URL</div>
            <input className="input font-mono" placeholder="(vacío = mismo origen) https://api.tudominio.com"
              value={apiCfg.baseUrl} onChange={e => setApiCfg({...apiCfg, baseUrl: e.target.value})}/>
          </div>
          <div>
            <div className="lbl">API Key (Bearer Token Opcional)</div>
            <input className="input font-mono" type="password" placeholder="Bearer token"
              value={apiCfg.apiKey} onChange={e => setApiCfg({...apiCfg, apiKey: e.target.value})}/>
          </div>
        </div>
        <div className="flex flex-wrap gap-2">
          <button className="btn btn-gold" onClick={saveApiCfg}><Ic name="save" className="icon-sm"/> Guardar Config</button>
          <button className="btn btn-ghost" onClick={testApi} disabled={apiBusy.test}>
            {apiBusy.test ? '...' : <><Ic name="activity" className="icon-sm"/> Probar Salud</>}
          </button>
          <button className="btn btn-ghost" onClick={pullApi} disabled={apiBusy.pull}>
            {apiBusy.pull ? '...' : <><Ic name="download-cloud" className="icon-sm"/> Pull desde Servidor</>}
          </button>
          <button className="btn btn-ghost" onClick={pushApi} disabled={apiBusy.push}>
            {apiBusy.push ? '...' : <><Ic name="upload-cloud" className="icon-sm"/> Push hacia Servidor</>}
          </button>
        </div>
        {apiStatus && (
          <div className={`mt-3 p-3 rounded text-xs font-mono ${apiStatus.ok?'bg-win/10 text-win':'bg-loss/10 text-loss'}`}>
            {apiStatus.msg}
          </div>
        )}
      </div>

      {/* Modals */}
      {showAccModal && (
        <AccountModal account={showAccModal} onClose={() => setShowAccModal(null)} onSave={saveAccount} />
      )}
      {showInstModal && (
        <InstrumentModal instrument={showInstModal} onClose={() => setShowInstModal(null)} onSave={saveInstrument} />
      )}
      <Modal open={!!confirmAction} onClose={() => setConfirmAction(null)} title={confirmAction?.title || 'Confirmar'}>
        <p className="text-sm text-slate-300 mb-5">{confirmAction?.message}</p>
        <div className="flex justify-end gap-2">
          <button className="btn btn-ghost" onClick={() => setConfirmAction(null)}>Cancelar</button>
          <button className={`btn ${confirmAction?.danger ? 'btn-danger' : 'btn-gold'}`} onClick={confirmAction?.onConfirm}>
            Confirmar
          </button>
        </div>
      </Modal>
    </div>
  );
};

const AccountModal = ({account, onClose, onSave}) => {
  const [form, setForm] = useState(account);
  const set = (k, v) => setForm(f => ({...f, [k]: v}));
  return (
    <Modal open={true} onClose={onClose} title={account.name ? 'Editar Cuenta' : 'Nueva Cuenta'}>
      <div className="space-y-3">
        <div><div className="lbl">Nombre de la Cuenta</div><input className="input" value={form.name} onChange={e => set('name', e.target.value)}/></div>
        <div className="grid grid-cols-2 gap-3">
          <div><div className="lbl">Balance Inicial ($)</div><input type="number" step="any" className="input num" value={form.initialBalance} onChange={e => set('initialBalance', +e.target.value)}/></div>
          <div>
            <div className="lbl">Modo Base de Riesgo</div>
            <select className="input" value={form.riskBaseMode || 'current'} onChange={e => set('riskBaseMode', e.target.value)}>
              <option value="current">Equidad Actual (Compuesto)</option>
              <option value="initial">Balance Inicial (Estático)</option>
            </select>
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div><div className="lbl">Riesgo % por Trade</div><input type="number" step="0.1" className="input num" value={form.riskPerTradePct} onChange={e => set('riskPerTradePct', +e.target.value)}/></div>
          <div><div className="lbl">Máx Trades por Día</div><input type="number" className="input num" value={form.maxTradesPerDay} onChange={e => set('maxTradesPerDay', +e.target.value)}/></div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div><div className="lbl">Límite Pérdida Diaria %</div><input type="number" step="0.1" className="input num" value={form.dailyLossLimitPct} onChange={e => set('dailyLossLimitPct', +e.target.value)}/></div>
          <div><div className="lbl">Límite Pérdida Semanal %</div><input type="number" step="0.1" className="input num" value={form.weeklyLossLimitPct} onChange={e => set('weeklyLossLimitPct', +e.target.value)}/></div>
        </div>
      </div>
      <div className="flex justify-end gap-2 mt-5">
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-gold" onClick={() => onSave(form)}>Guardar Cuenta</button>
      </div>
    </Modal>
  );
};

const InstrumentModal = ({instrument, onClose, onSave}) => {
  const [form, setForm] = useState(instrument);
  const set = (k, v) => setForm(f => ({...f, [k]: v}));
  return (
    <Modal open={true} onClose={onClose} title={instrument.symbol ? 'Editar Instrumento' : 'Nuevo Instrumento'}>
      <div className="space-y-3">
        <div><div className="lbl">Símbolo (Ej. EURUSD, XAUUSD, NQ)</div>
          <input className="input font-mono" value={form.symbol}
            onChange={e => set('symbol', e.target.value.toUpperCase())} disabled={!!instrument.symbol}/></div>
        <div><div className="lbl">Multiplicador del Contrato / Lote</div>
          <input type="number" step="any" className="input num" value={form.multiplier} onChange={e => set('multiplier', +e.target.value)}/></div>
        <div><div className="lbl">Pip / Tick Size (Opcional)</div>
          <input type="number" step="any" className="input num" value={form.pipSize || ''} onChange={e => set('pipSize', e.target.value ? +e.target.value : '')}/></div>
      </div>
      <div className="flex justify-end gap-2 mt-5">
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-gold" onClick={() => onSave(form)}>Guardar Instrumento</button>
      </div>
    </Modal>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastProvider><App /></ToastProvider>
);
</script>
</body>
</html>
